{% extends 'dashboard/base.html' %}
{% load static %}

{% block title %}Crear Foro - Nexus{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'createEvent.css' %}">
{% endblock %}

{% block content %}
<div class="form-container-stellar">
    <div class="form-card-stellar">
        <h2>
            <i class="fa-solid fa-comments header-icon"></i> Crear Nuevo Foro
        </h2>
        
        <form method="POST" enctype="multipart/form-data" class="stellar-form">
            {% csrf_token %}

            <div class="form-group-stellar">
                <label class="form-label-stellar">Imagen de Portada (Opcional)</label>
                <div class="input-field-wrapper">
                    <input type="file" name="imagen" accept="image/*">
                </div>
            </div>

            <div class="form-group-stellar">
                <label class="form-label-stellar">Título del Foro</label>
                <div class="input-field-wrapper">
                    <input type="text" name="titulo" placeholder="Ej. Dudas sobre Python / Backend" required>
                </div>
            </div>

            <div class="form-group-stellar">
                <label class="form-label-stellar">Categoría (Opcional)</label>
                <div class="input-field-wrapper">
                    <input type="text" name="categoria" placeholder="Ej. Programación, Videojuegos...">
                </div>
            </div>

            <div class="form-group-stellar">
                <label class="form-label-stellar">Descripción</label>
                <div class="input-field-wrapper">
                    <textarea name="descripcion" rows="4" placeholder="Explica detalladamente de qué se hablará en este foro..." required></textarea>
                </div>
            </div>

            <div class="form-actions-stellar">
                <button type="reset" class="btn-stellar-form btn-stellar-cancel">
                    <i class="fa-solid fa-broom"></i> Limpiar Campos
                </button>
                <button type="submit" class="btn-stellar-form btn-stellar-submit">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Publicar Foro
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
