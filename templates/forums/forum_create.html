<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Forum</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">🚀 Create New Forum</h4>
                    </div>
                    <div class="card-body">
                        <form method="POST" enctype="multipart/form-data">
                            {% csrf_token %}

                            <div class="mb-3">
                                <label class="form-label">Forum Cover Image (Optional)</label>
                                 <input type="file" name="imagen" class="form-control" accept="image/*">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Forum Title</label>
                                <input type="text" name="titulo" class="form-control" placeholder="e.g., Python Doubts" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Category (Optional)</label>
                                <input type="text" name="categoria" class="form-control" placeholder="e.g., Programming...">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Description</label>
                                <textarea name="descripcion" class="form-control" rows="4" placeholder="Explain what this forum is about..." required></textarea>
                            </div>
                            <div class="d-flex justify-content-between">
                                <a href="{% url 'forum_list' %}" class="btn btn-secondary">Cancel</a>
                                <button type="submit" class="btn btn-success">Publish Forum</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
